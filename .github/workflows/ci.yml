name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install NSIS
        shell: pwsh
        run: |
          $makensis = @(
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
            "${env:ProgramFiles}\NSIS\makensis.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (!$makensis) {
            choco install nsis --no-progress -y
          }

      - name: Build, test, and package
        shell: pwsh
        run: ./scripts/build.ps1 -Dotnet dotnet

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: waikan-windows-x64
          if-no-files-found: error
          path: |
            dist/Waikan-1.1.0-x64-setup.exe
            dist/Waikan-1.1.0-x64-setup.sha256.txt
            dist/Waikan-win-x64-1.1.0.zip
            dist/Waikan-win-x64-1.1.0.sha256.txt

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "dist/Waikan-1.1.0-x64-setup.exe" `
            "dist/Waikan-1.1.0-x64-setup.sha256.txt" `
            "dist/Waikan-win-x64-1.1.0.zip" `
            "dist/Waikan-win-x64-1.1.0.sha256.txt" `
            --title "这个词在外刊中 ${{ github.ref_name }}" `
            --generate-notes
